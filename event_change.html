<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./event_change.css">
    <title>Event Change Class</title>

</head>
<body>
    <div class="login">
        <label for="name">
            Name:
            <input type="text" name="name" id="idName" class="className">
        </label>
        <label for="password">
            Password:
            <input type="password" name="password" id="idPass" class="classPass">
        </label>
    </div>

    <div>
        <h3>Course</h3>

        <label for="html">
            <input type="radio" name="course" value="Html">
            Html
        </label>
        <label for="css">
            <input type="radio" name="course" value="Css">
            Css
        </label><label for="Javascript">
            <input type="radio" name="course" value="Javascript">
            Javascript
        </label>
    </div>
    <script src="./event_change.js"></script>
</body>
</html>
